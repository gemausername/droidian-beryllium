# Release workflow for Droidian Poco F1 (beryllium)
# Manual trigger for creating releases with specific tags

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release name'
        required: true
        type: string
      variant:
        description: 'Variant to build'
        required: true
        type: choice
        options:
          - all
          - phosh-ebbg
          - phosh-tianma
          - phosh-tianmaft
          - lomiri-ebbg
          - lomiri-tianma
          - lomiri-tianmaft
      build_kernel:
        description: 'Build kernel'
        required: false
        default: true
        type: boolean
      build_adaptation:
        description: 'Build adaptation packages'
        required: false
        default: true
        type: boolean
      build_rootfs:
        description: 'Build rootfs images'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must be in format v1.0.0"
            exit 1
          fi
          echo "Tag validated: $TAG"

  build-kernel:
    needs: validate-tag
    if: github.event.inputs.build_kernel == 'true'
    runs-on: ubuntu-latest
    container:
      image: quay.io/droidian/build-essential:current-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Initialize qemu-user-static
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build kernel
        run: |
          cd kernel
          apt-get update
          apt-get install -y linux-packaging-snippets
          mkdir -p debian/source
          cp -v /usr/share/linux-packaging-snippets/kernel-info.mk.example debian/kernel-info.mk
          echo "13" > debian/compat
          echo "3.0 (native)" > debian/source/format
          debian/rules debian/control
          RELENG_HOST_ARCH="arm64" releng-build-package

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages
          path: |
            *.deb
            out/KERNEL_OBJ/boot.img

  build-variant:
    needs: [validate-tag, build-kernel]
    if: always() && github.event.inputs.build_adaptation == 'true' && (needs.build-kernel.result == 'success' || needs.build-kernel.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ github.event.inputs.variant == 'all' && fromJSON('["phosh-ebbg","phosh-tianma","phosh-tianmaft","lomiri-ebbg","lomiri-tianma","lomiri-tianmaft"]') || fromJSON(format('["{0}"]', github.event.inputs.variant)) }}
      fail-fast: false
    container:
      image: quay.io/droidian/build-essential:current-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download kernel artifacts
        if: needs.build-kernel.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: kernel-packages
          path: kernel/output/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Initialize qemu-user-static
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build adaptation package
        run: |
          bash scripts/build-adaptation-variant.sh ${{ matrix.variant }}

      - name: Build rootfs
        if: github.event.inputs.build_rootfs == 'true'
        run: |
          bash scripts/build-rootfs-variant.sh ${{ matrix.variant }}

      - name: Upload variant artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidian-${{ matrix.variant }}
          path: |
            output/*.deb
            output/*.img

  create-release:
    needs: [validate-tag, build-variant]
    if: always() && needs.validate-tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.img
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            # ${{ github.event.inputs.release_name }}
            
            **Version:** ${{ github.event.inputs.tag }}
            
            ## Variants Included
            
            ${{ github.event.inputs.variant == 'all' && '- phosh-ebbg (Phosh + eBBG Panel)
            - phosh-tianma (Phosh + Tianma Panel)
            - phosh-tianmaft (Phosh + Tianma + Focaltech)
            - lomiri-ebbg (Lomiri + eBBG Panel)
            - lomiri-tianma (Lomiri + Tianma Panel)
            - lomiri-tianmaft (Lomiri + Tianma + Focaltech)' || format('- {0}', github.event.inputs.variant) }}
            
            ## Build Information
            
            - **Build Date:** ${{ github.event.head_commit.timestamp }}
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}
            
            ## Installation
            
            See [README.md](../../blob/main/README.md) for detailed installation instructions.
            
            ## Changes
            
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
