# Phosh Desktop Configuration for Poco F1 (Tianma)

[org.gnome.desktop.interface]
clock-show-date=true
clock-show-seconds=false
cursor-size=48
font-name='Cantarell 11'
gtk-theme='Adwaita-dark'
icon-theme='Adwaita'
monospace-font-name='Monospace 12'
text-scaling-factor=1.0

[org.gnome.desktop.wm.preferences]
titlebar-font='Cantarell Bold 11'

[org.gnome.desktop.background]
picture-uri='file:///usr/share/backgrounds/gnome/adwaita-d.png'
picture-uri-dark='file:///usr/share/backgrounds/gnome/adwaita-d.png'

[org.gnome.desktop.screensaver]
picture-uri='file:///usr/share/backgrounds/gnome/adwaita-d.png'

[org.gnome.desktop.peripherals.touchscreen]
send-events=enabled

[org.gnome.desktop.peripherals.mouse]
speed=0.0

[org.gnome.desktop.peripherals.keyboard]
delay=500
repeat-interval=30
