# Variant Configuration: Phosh + TianmaFT Panel
# Xiaomi Poco F1 (beryllium) with Tianma panel + Focaltech touch

VARIANT="phosh-tianmaft"
DESKTOP="phosh"
PANEL="tianmaft"
PANEL_TYPE="Tianma + Focaltech Touch"

# Display configuration
DISPLAY_WIDTH=1080
DISPLAY_HEIGHT=2246
DISPLAY_DENSITY=403
DISPLAY_SCALE=1.5

# Panel specific settings
PANEL_COMPATIBLE="tianma,td4375"
PANEL_ORIENTATION=0
PANEL_REFRESH_RATE=60

# Touch configuration (Focaltech)
TOUCH_COMPATIBLE="focaltech,fts"
TOUCH_MAX_X=1079
TOUCH_MAX_Y=2245
TOUCH_IRQ=486
TOUCH_RESET=32

# Phosh specific
PHOSH_SCALE=1.5
PHOSH_NOTCH_FIX=true

# Package dependencies
PACKAGES="
  phosh
  phoc
  gdm3
  gnome-session
  gnome-terminal
  gnome-control-center
  gnome-settings-daemon
  libhandy-1-0
  libphosh0
  sway
  wlr-randr
"

# Build target
BUILD_TARGET="droidian-phosh-tianmaft"
OUTPUT_FILE="droidian-phosh-tianmaft-arm64.img"
