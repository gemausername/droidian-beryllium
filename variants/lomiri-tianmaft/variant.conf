# Variant Configuration: Lomiri + TianmaFT Panel
# Xiaomi Poco F1 (beryllium) with Tianma panel + Focaltech touch

VARIANT="lomiri-tianmaft"
DESKTOP="lomiri"
PANEL="tianmaft"
PANEL_TYPE="Tianma + Focaltech Touch"

# Display configuration
DISPLAY_WIDTH=1080
DISPLAY_HEIGHT=2246
DISPLAY_DENSITY=403
DISPLAY_SCALE=1.5

# Panel specific settings
PANEL_COMPATIBLE="tianma,td4375"
PANEL_ORIENTATION=0
PANEL_REFRESH_RATE=60

# Touch configuration (Focaltech)
TOUCH_COMPATIBLE="focaltech,fts"
TOUCH_MAX_X=1079
TOUCH_MAX_Y=2245
TOUCH_IRQ=486
TOUCH_RESET=32

# Lomiri specific
LOMIRI_SCALE=1.0
LOMIRI_NOTCH_FIX=true

# Package dependencies
PACKAGES="
  lomiri
  lomiri-desktop-env
  lomiri-session
  lomiri-system-settings
  lomiri-terminal
  lomiri-app-launch
  lomiri-url-dispatcher
  unity8
  unity-session
  qtdeclarative5-dev
  qml-module-ubuntu-components
  qml-module-lomiri-components
"

# Build target
BUILD_TARGET="droidian-lomiri-tianmaft"
OUTPUT_FILE="droidian-lomiri-tianmaft-arm64.img"
