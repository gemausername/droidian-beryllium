# Lomiri Desktop Configuration for Poco F1 (Tianma)

[com Canonical Unity8]
form-factor=Phone
persistentToolbar=false
lockScreenOrientation=Automatic

[com Canonical Unity8 Shell]
scalingFactor=1.0
smallScreenMode=false

[com Canonical Unity8 Launcher]
filterByCurrentActivity=false
filterByRunningApplications=false

[org.gnome.desktop.interface]
cursor-size=36
font-name='Ubuntu 11'
gtk-theme='Ambiance'
icon-theme='Suru'
monospace-font-name='Ubuntu Mono 12'
text-scaling-factor=1.0

[org.gnome.desktop.wm.preferences]
titlebar-font='Ubuntu Bold 11'

[com Canonical Unity8 Panel]
enableIndicatorPanel=true
