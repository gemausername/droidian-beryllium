# Variant Configuration: Phosh + eBBG Panel
# Xiaomi Poco F1 (beryllium) with eBBG (Everlight) panel

VARIANT="phosh-ebbg"
DESKTOP="phosh"
PANEL="ebbg"
PANEL_TYPE="eBBG (Everlight)"

# Display configuration
DISPLAY_WIDTH=1080
DISPLAY_HEIGHT=2246
DISPLAY_DENSITY=403
DISPLAY_SCALE=1.5

# Panel specific settings
PANEL_COMPATIBLE="truly,td4375"
PANEL_ORIENTATION=0
PANEL_REFRESH_RATE=60

# Touch configuration
TOUCH_COMPATIBLE="fts_ts"
TOUCH_MAX_X=1079
TOUCH_MAX_Y=2245

# Phosh specific
PHOSH_SCALE=1.5
PHOSH_NOTCH_FIX=true

# Package dependencies
PACKAGES="
  phosh
  phoc
  gdm3
  gnome-session
  gnome-terminal
  gnome-control-center
  gnome-settings-daemon
  libhandy-1-0
  libphosh0
  sway
  wlr-randr
"

# Build target
BUILD_TARGET="droidian-phosh-ebbg"
OUTPUT_FILE="droidian-phosh-ebbg-arm64.img"
